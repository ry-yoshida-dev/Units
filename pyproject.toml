[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "units"
version = "0.1.0"
authors = [
  { name="Ryuto Yoshida"},
]
description = "Utilities for working with physical quantities and unit conversions."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "typing-extensions>=4.4",
]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida-dev/Units"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/Units/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
units = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.basedpyright]
# The quantities refer to one another for their products and quotients (a length
# times a length is an area, an area divided by a length is a length), so the
# subpackages import each other by design.
reportImportCycles = false
